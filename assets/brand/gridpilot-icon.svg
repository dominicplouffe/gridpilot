<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GridPilot app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#18223A"/>
      <stop offset="1" stop-color="#0B1120"/>
    </linearGradient>
    <linearGradient id="beacon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC94D"/>
      <stop offset="1" stop-color="#FF9A0F"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7FDBFF"/>
      <stop offset="1" stop-color="#3EC6FF"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="8" y="8" width="1008" height="1008" rx="220" fill="none" stroke="#26324D" stroke-width="4"/>
  <!-- the grid -->
  <g fill="#26324D">
    <rect x="648" y="184" width="192" height="192" rx="40"/>
    <rect x="648" y="416" width="192" height="192" rx="40"/>
    <rect x="184" y="648" width="192" height="192" rx="40"/>
    <rect x="416" y="648" width="192" height="192" rx="40"/>
  </g>
  <!-- the window, placed on a 2x2 selection -->
  <rect x="184" y="184" width="424" height="424" rx="48" fill="url(#beacon)"/>
  <path d="M184 232 a48 48 0 0 1 48 -48 h328 a48 48 0 0 1 48 48 v28 h-424 Z" fill="#FFFFFF" fill-opacity="0.2"/>
  <!-- the pilot: a heading arrow steering toward the selection -->
  <rect x="648" y="648" width="192" height="192" rx="40" fill="#141C2F" stroke="#3EC6FF" stroke-opacity="0.35" stroke-width="6"/>
  <path d="M676 676 L818 730 L752 752 L730 818 Z" fill="url(#horizon)" stroke="url(#horizon)" stroke-width="14" stroke-linejoin="round"/>
</svg>
