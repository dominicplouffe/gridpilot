# Move to .github/workflows/ci.yml to enable (this session could not push workflow files).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-darwin
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Type-check the macOS backend without a Mac.
      - run: cargo clippy -p gridpilot -p gridpilot-macos --target aarch64-apple-darwin -- -D warnings
      - run: cargo run -q -p gridpilot -- check config/gridpilot.toml

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p gridpilot
      - run: cargo test --workspace
